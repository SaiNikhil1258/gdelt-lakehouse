name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 1: fast, no Docker. Lint + unit tests (local Spark on tiny DataFrames).
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # PySpark 3.5 needs a JVM (11 or 17)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Only catches real errors (syntax errors, undefined names). Tighten later.
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 .

      - name: Unit tests
        run: pytest -q

  # Tier 2: the real stack. Compose up, synthetic sample -> Bronze -> Silver -> Gold -> checks.
  pipeline-test:
    needs: lint-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use the CI environment file
        run: cp ci/ci.env .env

      - name: Pipeline test on the synthetic sample
        run: bash scripts/ci_pipeline_smoke.sh

      - name: Container status and logs (on failure)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150 || true

      - name: Upload job logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-test-logs
          path: logs/ci_smoke/
          if-no-files-found: ignore

      - name: Shut down
        if: always()
        run: docker compose down -v || true